{% extends "base.html" %}

{% block body %}
{% if user %}
<div class="container-fluid py-3">

  <div class="card shadow-sm border-0">
    <div class="card-body p-4">

      <!-- Top summary + filters -->
      <div class="row g-3 align-items-start mb-4">

        <!-- Summary metrics -->
        <div class="col-12 col-xl-7">
          <div class="row g-4 align-items-start">
            <div class="col-auto">
              <div class="text-muted small text-uppercase">Monthly Cost</div>
              <div id="total-current-cost" class="fs-3 fw-bold text-danger">
                $0.00
              </div>
            </div>

            <div class="col-auto">
              <div class="text-muted small text-uppercase">Total Resources</div>
              <div id="total-resource-count" class="fs-3 fw-bold text-primary">
                {{ total_count or 0 }}
              </div>
            </div>

            <div class="col-auto">
              <div class="text-muted small text-uppercase">Sorted by Cost</div>
              <div class="fw-bold text-success">
                Highest → Lowest
              </div>
            </div>
          </div>
        </div>

        <!-- Filters -->
        <div class="col-12 col-xl-5">
          <div class="row g-2 justify-content-start">
            <div class="col-12 col-lg-8">
              <select
                id="filter"
                name="resource_type"
                class="form-select form-select-lg"
                hx-get="/p"
                hx-include="#filter,#region_filter"
                hx-sync="#inventory:abort"
                hx-target="#inventory"
                hx-swap="innerHTML">
                <option value="all" {% if (current_resource_type | default('all')) == 'all' %}selected{% endif %}>
                  All
                </option>
                {% for option in selections %}
                <option value="{{ option }}" {% if option == (current_resource_type | default('all')) %}selected{% endif %}>
                  {{ option }}
                </option>
                {% endfor %}
              </select>
            </div>

            <div class="col-12 col-lg-4">
              <select
                id="region_filter"
                name="region"
                class="form-select form-select-lg"
                hx-get="/p"
                hx-include="#filter,#region_filter"
                hx-sync="#inventory:abort"
                hx-target="#inventory"
                hx-swap="innerHTML">
                {% for region in regions %}
                <option value="{{ region }}" {% if region == (current_region | default('')) %}selected{% endif %}>
                  {{ region }}
                </option>
                {% endfor %}
              </select>
            </div>
          </div>
        </div>
      </div>

      <!-- Helper text -->
      <div class="row g-3 mb-4">
        <div class="col-12 col-md-6">
          <div class="alert alert-light border mb-0 py-3 px-3">
            Use the <strong class="text-danger">Delete</strong> button to mark a resource for deletion.
          </div>
        </div>
        <div class="col-12 col-md-6">
          <div class="alert alert-light border mb-0 py-3 px-3">
            Use the <strong class="text-success">Extend</strong> button to set expiration {{ days }} from today.
          </div>
        </div>
      </div>

      <!-- Initial load -->
      <span
        hx-get="/p"
        hx-include="#filter,#region_filter"
        hx-sync="#inventory:abort"
        hx-trigger="revealed once"
        hx-swap="innerHTML"
        hx-target="#inventory"></span>

    </div>
  </div>

  <!-- Inventory -->
  <div id="inventory" class="mt-4"></div>
</div>

<script>
  function sortCardsByCost() {
    const container = document.getElementById("inventory");
    if (!container) return;

    const cards = Array.from(container.querySelectorAll("form.card"));
    if (cards.length === 0) return;

    cards.sort((a, b) => {
      const costA = parseFloat(a.dataset.cost || 0);
      const costB = parseFloat(b.dataset.cost || 0);
      return costB - costA;
    });

    cards.forEach(card => container.appendChild(card));
  }

  document.body.addEventListener("htmx:afterSwap", function (evt) {
    if (evt.target && evt.target.id === "inventory") {
      sortCardsByCost();
    }
  });

  document.addEventListener("DOMContentLoaded", function () {
    sortCardsByCost();
  });
</script>

{% endif %}
{% endblock %}
