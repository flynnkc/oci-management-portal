title: "OKE Terraform Stack"
description: "Schema for OCI Resource Manager variables used to provision OKE."
schemaVersion: 1.1.0
version: "20190304"

locale: "en"

informationalText: |
  This stack deploys an Oracle Kubernetes Engine (OKE) cluster on OCI using Flannel overlay pod networking.
  The network topology includes subnets for the private API endpoint, worker nodes, additional private workloads,
  and public load balancers, with NSG/security-list controls aligned to the existing networking configuration.

  Worker nodes are provisioned with configurable shape, OCPU, and memory values, and can use either
  an automatically selected latest compatible Oracle Linux OKE platform image or an explicitly provided image OCID.

  The stack also supports optional creation of baseline IAM policies for OKE operation,
  creates an OCI Identity Domain confidential application for portal OIDC login,
  and includes provider authentication fields that are commonly auto-populated in OCI Resource Manager contexts.

variableGroups:
  - title: "General Variables"
    variables:
      - label

  - title: "OKE Cluster Configuration"
    variables:
      - compartment_ocid
      - k8s_version
      - custom_nodes

  - title: "Worker Node Configuration"
    variables:
    - node_shape
    - node_ocpus
    - node_memory
    - nodepool_size
    - use_latest_platform_oke_image
    - node_image_ocid
    - worker_ssh_public_key
    visible: ${custom_nodes}

  - title: "Identity & Access Management"
    variables:
    - enable_oke_iam_policies
    - oke_policy_name
    - identity_domain_id
    - confidential_application_display_name
    - confidential_application_name
    - confidential_application_description
    - confidential_application_base_url
    - confidential_application_authorization_code_grant_enabled
    - confidential_application_client_credentials_grant_enabled
    - confidential_application_refresh_token_grant_enabled
    - confidential_application_implicit_grant_enabled
    - confidential_application_password_grant_enabled
    - confidential_application_jwt_bearer_grant_enabled
    - confidential_application_allowed_operation
    - confidential_application_all_url_schemes_allowed
    - confidential_application_bypass_consent
    - confidential_application_force_delete

  - title: Hidden
    variables:
      - tenancy_ocid
      - user_ocid
      - fingerprint
      - private_key_path
      - private_key_password
      - region
      - create_endpoint_subnet
      - enable_external_kubectl_access
      - external_kubectl_access_cidr
      - lb_ingress_source_cidr
      - enable_lb_http_ingress
      - confidential_application_redirect_uris
      - confidential_application_post_logout_redirect_uris
      - confidential_application_allowed_grant
      - confidential_application_allowed_grants
      - confidential_application_allowed_operations
    visible: false

variables:
  # Hidden
  tenancy_ocid:
    title: tenancy_ocid

  user_ocid:
    title: user_ocid
    description: "User OCID injected automatically in Resource Manager; required for CLI runs"

  private_key_path:
    title: private key path
    description: "PEM key path used for CLI deployments"

  fingerprint:
    title: fingerprint
    description: "Key fingerprint used for CLI deployments"

  private_key_password:
    title: private_key_password

  region:
    title: region

  create_endpoint_subnet:
    title: create_endpoint_subnet
    description: "Internal toggle for creating the dedicated private OKE API endpoint subnet."

  # OKE Configuration
  k8s_version:
    type: oci:kubernetes:versions:id
    title: "Kubernetes Version"
    description: "OKE Kubernetes version. Leave empty to use the latest supported patch version."
    required: false
    dependsOn:
      compartmentId: ${compartment_ocid}
      clusterOptionId: "all"

  compartment_ocid:
    type: oci:identity:compartment:id
    title: "Compartment"
    description: "Compartment where resources will be created."
    required: true

  enable_external_kubectl_access:
    type: boolean
    title: "Enable External kubectl Access"
    description: "Enable public external kubectl access to the OKE API endpoint."
    default: false

  external_kubectl_access_cidr:
    type: string
    title: "External kubectl Access CIDR"
    description: "CIDR block allowed to access the OKE API endpoint when external access is enabled."
    required: false
    visible: ${enable_external_kubectl_access}
    pattern: "^([0-9]{1,3}\\.){3}[0-9]{1,3}/([0-9]|[1-2][0-9]|3[0-2])$"

  lb_ingress_source_cidr:
    type: string
    title: "Load Balancer Ingress Source CIDR"
    description: "CIDR allowed to access Kubernetes LoadBalancer services (HTTPS always, HTTP optional)."
    default: "0.0.0.0/0"
    required: true

  enable_lb_http_ingress:
    type: boolean
    title: "Enable Load Balancer HTTP Ingress"
    description: "Allow inbound HTTP (port 80) to Kubernetes LoadBalancer services."
    default: false

  custom_nodes:
    type: boolean
    title: "Custom Worker Nodes?"
    default: false

  # Node Configuration
  node_shape:
    type: oci:core:instanceshape:name
    title: "Node Shape"
    description: "Compute shape for worker nodes."
    default: "VM.Standard.A1.Flex"
    required: false
    dependsOn:
      compartmentId:  ${compartment_ocid}

  node_ocpus:
    type: number
    title: "Node OCPUs"
    description: "Number of OCPUs for worker nodes (Flex shape)."
    default: 1
    required: false
    minimum: 1

  node_memory:
    type: number
    title: "Node Memory (GB)"
    description: "Memory in GB for worker nodes (Flex shape)."
    default: 8
    required: false
    minimum: 1

  node_image_ocid:
    title: Node Image    
    description: Worker Image    
    type: oci:core:image:id    
    required: false   
    visible:
      not:
      - ${use_latest_platform_oke_image}
    dependsOn:      
       compartmentId: ${compartment_ocid}
       operatingSystem: "Oracle Linux"
       shape: ${node_shape}

  worker_ssh_public_key:
    type: oci:core:ssh:publickey
    title: "Worker Node SSH Public Key"
    description: "SSH public key injected into worker nodes for SSH access."
    required: false

  use_latest_platform_oke_image:
    type: boolean
    title: "Use latest platform OKE image"
    description: "Use latest image for selected shape"
    default: true

  nodepool_size:
    type: number
    title: "Number of Worker Nodes"
    default: 1
    required: true

  label:
    type: string
    title: "Project Label"
    description: "A prefix to resources created by the script"
    required: true

  # IAM
  enable_oke_iam_policies:
    type: boolean
    title: "Enable OKE IAM Policies"
    default: false
    description: "Create baseline IAM policies required for OKE cluster and node pool operation"

  oke_policy_name:
    type: string
    title: "OKE Policy Name"
    default: "oke-iam-policy"
    description: "Name for the IAM policy that grants OKE permissions"
    required: false
    visible: ${enable_oke_iam_policies}

  identity_domain_id:
    type: oci:identity:domain:id
    title: "Identity Domain"
    description: "Existing OCI Identity Domain where the management portal confidential application will be created."
    required: true
    dependsOn:
      compartmentId: ${tenancy_ocid}

  confidential_application_display_name:
    type: string
    title: "Confidential Application Display Name"
    description: "Display name for the Identity Domain confidential application. Leave empty to derive from Project Label."
    required: false

  confidential_application_name:
    type: string
    title: "OAuth Client ID"
    description: "Immutable OAuth client name/client ID created in the Identity Domain. Use this value as OCI_MGMT_DASH_CLIENT_ID. Leave empty to derive from Project Label."
    required: false
    pattern: "^[A-Za-z0-9._-]+$"

  confidential_application_description:
    type: string
    title: "Confidential Application Description"
    description: "Description stored on the Identity Domain confidential application."
    default: "Confidential OIDC application for OCI Management Portal"
    required: false

  confidential_application_base_url:
    type: string
    title: "Portal Base URL"
    description: "Public base URL for the portal. Terraform registers <base-url>/callback as the default redirect URI."
    default: "http://localhost:5000"
    required: true
    pattern: "^https?://.+"

  confidential_application_authorization_code_grant_enabled:
    type: boolean
    title: "Authorization Code Grant"
    description: "Enable authorization_code for portal user login."
    default: true

  confidential_application_client_credentials_grant_enabled:
    type: boolean
    title: "Client Credentials Grant"
    description: "Enable client_credentials for service-to-service access."
    default: true

  confidential_application_refresh_token_grant_enabled:
    type: boolean
    title: "Refresh Token Grant"
    description: "Enable refresh_token if the application needs refresh tokens."
    default: false

  confidential_application_implicit_grant_enabled:
    type: boolean
    title: "Implicit Grant"
    description: "Enable implicit grant."
    default: false

  confidential_application_password_grant_enabled:
    type: boolean
    title: "Password Grant"
    description: "Enable password grant."
    default: false

  confidential_application_jwt_bearer_grant_enabled:
    type: boolean
    title: "JWT Bearer Grant"
    description: "Enable JWT bearer grant."
    default: false

  confidential_application_allowed_operation:
    type: enum
    title: "Allowed OAuth Client Operation"
    description: "Primary OAuth client operation enabled for the confidential application. Keep introspect selected for the portal token introspection flow."
    default: introspect
    enum:
      - introspect
      - onBehalfOfUser
    required: false

  confidential_application_redirect_uris:
    title: "Additional Redirect URIs"
    description: "Hidden advanced list. Leave empty to use Portal Base URL + /callback."

  confidential_application_post_logout_redirect_uris:
    title: "Additional Post-Logout Redirect URIs"
    description: "Hidden advanced list. Leave empty to use Portal Base URL."

  confidential_application_allowed_grants:
    title: "Additional OAuth Grants"
    description: "Hidden advanced list for extra OAuth grant types."

  confidential_application_allowed_grant:
    title: "Legacy OAuth Grant"
    description: "Hidden legacy single grant field. Use the grant checkboxes instead."

  confidential_application_allowed_operations:
    title: "Additional OAuth Client Operations"
    description: "Hidden advanced list for extra OAuth client operations."

  confidential_application_all_url_schemes_allowed:
    type: boolean
    title: "Allow HTTP Redirect URLs"
    default: true
    description: "Allow localhost or plain HTTP load balancer callback URLs. Disable when all redirect URLs use HTTPS."

  confidential_application_bypass_consent:
    type: boolean
    title: "Bypass User Consent"
    default: true
    description: "Skip consent prompts for the configured OIDC scopes."

  confidential_application_force_delete:
    type: boolean
    title: "Force Delete Confidential Application"
    default: true
    description: "Force delete the confidential application during stack destroy."
