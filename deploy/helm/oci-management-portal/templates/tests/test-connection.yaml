apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "oci-management-portal.fullname" . }}-test-connection"
  labels:
    {{- include "oci-management-portal.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  restartPolicy: Never
  containers:
    - name: wget
      image: busybox:1.36
      command:
        - wget
      args:
        - "http://{{ include "oci-management-portal.fullname" . }}:{{ .Values.service.port }}/health"
        - "-q"
        - "-O"
        - "-"
