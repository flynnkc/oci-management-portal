image:
  repository: ocir.us-ashburn-1.oci.oraclecloud.com/examplenamespace1/oci-management-portal
  tag: "xxxxxxxxx"
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ocirsecret

serviceAccount:
  create: false
  name: default
  automount: false

config:
  create: true
  existingConfigMap: ""
  appUri: "http://10.x.x.x"
  proxy: "true"
  tagNamespace: "Usage-Management"
  tagKey: "Owner"
  filterNamespace: "Usage-Management"
  filterKey: "Expires"
  cleanupCompartment: "ocid1.compartment.oc1..example2"
  authType: "instance_principal"
  idmEndpoint: "https://idcs-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx.identity.oraclecloud.com"
  clientId: "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
  sessionBackend: "filesystem"
  # Requires an HTTPS frontend; terminate TLS at your load balancer / ingress.
  sessionCookieSecure: true


secret:
  create: false
  existingSecret: oci-management-portal-secrets

expiredResourceReport:
  enabled: false
  mode: managers  # managers: shared topic; owners: one dedicated topic per email
  dryRun: false
  ownerNotifications: #search for the topics to be present for owners.
    compartmentId: "ocid1.compartment.oc1..example2"
    topicPrefix: "gitdash"
    allowedEmailDomains: "oracle.com"  # optional comma-separated exact domains, e.g. oracle.com
  schedule: "0 9 1 * *"
  command:
    - python
    - -m
    - modules.reports.expired_resources_notification
  regions: ""
  maxItems: 25
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  backoffLimit: 2
  notification:  #for managers mode topic id details.
    topicId: ""
    region: ""
    endpoint: ""
    title: "OCI expired resources"
  podAnnotations: {}
  resources: {}

service:
  type: LoadBalancer
  port: 80
  #annotations: 
   #oci.oraclecloud.com/load-balancer-type: "lb"
    #oci.oraclecloud.com/reserved-ips: "141.148.xxx.xxxx"
