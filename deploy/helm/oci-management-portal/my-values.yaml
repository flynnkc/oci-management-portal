  tag: "xxxxxxxxx"
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ocirsecret

config:
  create: true
  existingConfigMap: ""
  appUri: "http://141.148.xx.xxx"
  proxy: "true"
